<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Repick — IG Post 1080×1080</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@300;400;500;600&display=swap" rel="stylesheet" />
<style>
  html, body { margin:0; width:1080px; height:1080px; overflow:hidden; }
  body { position:relative; background:#0E0E10; color:#FFFBD4; font-family:'Space Grotesk',system-ui,sans-serif; }
  /* liquid-metal mesh */
  .bg { position:absolute; inset:0; overflow:hidden; }
  .blob { position:absolute; border-radius:50%; }
  .b1 { width:760px; height:760px; left:-240px; top:-260px;
        background:radial-gradient(circle at 35% 35%, rgba(226,35,15,.9), rgba(169,14,2,.4) 55%, transparent 75%); }
  .b2 { width:640px; height:640px; right:-200px; bottom:-220px;
        background:radial-gradient(circle at 55% 45%, rgba(255,251,212,.16), transparent 70%); }
  .b3 { width:540px; height:540px; right:60px; top:-180px;
        background:radial-gradient(circle at 50% 50%, rgba(143,12,2,.55), transparent 70%); }
  .grid { position:absolute; inset:0;
          background-image:linear-gradient(rgba(255,251,212,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,251,212,.035) 1px,transparent 1px);
          background-size:72px 72px; }
  .vignette { position:absolute; inset:0;
          background:radial-gradient(ellipse 75% 70% at 50% 45%, transparent 40%, rgba(14,14,16,.72) 100%); }
  .content { position:relative; height:100%; padding:76px 84px; display:flex; flex-direction:column; }
  header { display:flex; align-items:center; gap:20px; }
  header img { width:64px; height:64px; }
  header .name { font-family:'Anton',sans-serif; font-size:44px; letter-spacing:.02em; }
  header .tag { margin-left:auto; font-size:17px; letter-spacing:.42em; color:rgba(255,251,212,.5); text-transform:uppercase; }
  .middle { flex:1; display:flex; flex-direction:column; justify-content:center; }
  .eyebrow { font-size:19px; letter-spacing:.5em; text-transform:uppercase; color:rgba(255,251,212,.62); }
  h1 { margin:26px 0 0; font-family:'Anton',sans-serif; font-weight:400; font-size:132px; line-height:.98; text-transform:uppercase; letter-spacing:.01em; }
  h1 .dot { color:#E2230F; }
  .sub { margin-top:34px; max-width:720px; font-size:30px; line-height:1.5; color:rgba(255,251,212,.72); font-weight:300; }
  footer { display:flex; align-items:center; justify-content:space-between; }
  .handle { display:inline-flex; align-items:center; gap:14px; font-size:22px; letter-spacing:.08em; color:rgba(255,251,212,.85); }
  .handle svg { width:30px; height:30px; }
  .cta { display:inline-flex; align-items:center; justify-content:center; min-height:60px; padding:0 44px; border-radius:999px;
         background:linear-gradient(135deg,#E2230F,#8F0C02); color:#FFFBD4; font-size:22px; font-weight:600; letter-spacing:.12em; text-transform:uppercase;
         box-shadow:0 18px 50px rgba(169,14,2,.45), inset 0 1px 0 rgba(255,251,212,.35); }
</style>
</head>
<body>
  <div class="bg">
    <div class="blob b1"></div>
    <div class="blob b2"></div>
    <div class="blob b3"></div>
  </div>
  <div class="grid"></div>
  <div class="vignette"></div>
  <div class="content">
    <header>
      <img src="../../logo-mark.svg" alt="" />
      <span class="name">REPICK</span>
      <span class="tag">SEE IT. PICK IT.</span>
    </header>
    <div class="middle">
      <div class="eyebrow">Preloved jacket buyback</div>
      <h1>Sell your<br/>jacket<span class="dot">.</span></h1>
      <div class="sub">Cash offer in 24 hours. We buy, restore, and rehome iconic vintage outerwear.</div>
    </div>
    <footer>
      <span class="handle">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5"/><path d="M16 11.4a4 4 0 1 1-7.9 1.2 4 4 0 0 1 7.9-1.2z"/><line x1="17.5" y1="6.5" x2="17.5" y2="6.5"/></svg>
        @repick_id
      </span>
      <span class="cta">DM your photos</span>
    </footer>
  </div>
</body>
</html>
